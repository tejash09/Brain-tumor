<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
  
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      
      body {
        font-family: 'Roboto', sans-serif;
        line-height: 1.6;
        color: #333;
        background-color: #f3f4f6;
      }
      
      
      header {
        background-color: #005f73;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        padding: 1.5rem;
        position: relative;
      }
      
      nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        max-width: 1200px;
        margin: 0 auto;
      }
      
      .logo {
        font-size: 1.8rem;
        font-weight: bold;
        color: #ffffff;
      }
      
      nav ul {
        display: flex;
        list-style: none;
      }
      
      nav ul li {
        margin-left: 2rem;
      }
      
      nav ul li a {
        text-decoration: none;
        color: #ffffff;
        padding: 0.5rem 1rem;
        border-radius: 8px;
        transition: background-color 0.3s ease, color 0.3s ease;
      }
      
      nav ul li a:hover {
        background-color: #0a9396;
        color: #ffffff;
      }
      
      
      .hero {
        background: linear-gradient(135deg, #0a9396, #005f73);
        padding: 6rem 2rem;
        text-align: center;
        color: #ffffff;
      }
      
      .hero-content h1 {
        font-size: 4rem;
        margin-bottom: 1.5rem;
        font-family: 'Montserrat', sans-serif;
      }
      
      .hero-content p {
        font-size: 1.4rem;
        margin-bottom: 2.5rem;
      }
      
      .btn {
        display: inline-block;
        background-color: #005f73;
        color: #ffffff;
        text-decoration: none;
        padding: 0.9rem 1.8rem;
        border-radius: 8px;
        transition: background-color 0.3s ease, transform 0.3s ease;
      }
      
      .btn:hover {
        background-color: #0a9396;
        transform: translateY(-3px);
      }
      
      
      .features {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        max-width: 1200px;
        margin: 5rem auto;
      }
      
      .feature {
        text-align: center;
        padding: 2.5rem;
        max-width: 340px;
        background-color: #ffffff;
        border-radius: 12px;
        box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
        margin: 1.5rem;
      }
      
      .feature img {
        width: 100px;
        height: 100px;
        margin-bottom: 1.5rem;
      }
      
      .feature h3 {
        font-size: 1.8rem;
        margin-bottom: 1.5rem;
        color: #005f73;
      }
      
      
      .upload {
        background-color: #ffffff;
        padding: 4.5rem 2rem;
        text-align: center;
        border-top: 5px solid #0a9396;
      }
      
      .upload h2 {
        font-size: 2.8rem;
        margin-bottom: 2rem;
        color: #005f73;
      }
      
      
      .file-label {
        background-color: #005f73;
        color: #ffffff;
        padding: 0.9rem 1.8rem;
        border-radius: 8px;
        cursor: pointer;
        margin-right: 1.5rem;
        transition: background-color 0.3s ease, transform 0.3s ease;
      }
      
      .file-label:hover {
        background-color: #0a9396;
        transform: translateY(-3px);
      }
      
      
      footer {
        background-color: #005f73;
        color: #ffffff;
        padding: 1.5rem;
        text-align: center;
        border-top: 5px solid #0a9396;
      }
      
      .footer-content {
        max-width: 1200px;
        margin: 0 auto;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      
      
      .contact {
        max-width: 600px;
        margin: 0 auto;
        padding: 2.5rem;
      }
      
      .contact h2 {
        font-size: 2.8rem;
        margin-bottom: 2.5rem;
        color: #005f73;
        text-align: center;
      }
      
      .contact form {
        display: flex;
        flex-direction: column;
      }
      
      .contact label {
        font-weight: bold;
        margin-bottom: 0.5rem;
      }
      
      .contact input,
      .contact textarea {
        padding: 0.9rem;
        margin-bottom: 1.5rem;
        border: 1px solid #cccccc;
        border-radius: 8px;
      }
      
      .contact textarea {
        height: 160px;
      }
      
      
      .contact-info {
        margin-top: 2rem;
        padding: 2.5rem;
        background-color: #ffffff;
        border-radius: 12px;
        box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
      }
      
      .contact-info h3 {
        font-size: 1.8rem;
        margin-bottom: 1rem;
        color: #005f73;
        text-align: center;
      }
      
      .contact-info p {
        margin-bottom: 0.5rem;
      }
      
      
      form {
        max-width: 500px;
        margin: 0 auto;
        text-align: center;
        padding: 2.5rem;
      }
      
      label.file-label {
        display: inline-block;
        background-color: #005f73;
        color: #ffffff;
        padding: 0.9rem 1.8rem;
        border-radius: 8px;
        cursor: pointer;
        margin-top: 1.5rem;
        transition: background-color 0.3s ease, transform 0.3s ease;
      }
      
      label.file-label:hover {
        background-color: #0a9396;
        transform: translateY(-3px);
      }
      
      label span {
        font-size: 1.3rem;
      }
      
      input[type="file"] {
        display: none;
      }
      
      button.btn {
        display: inline-block;
        padding: 0.9rem 1.8rem;
        background-color: #ff6f61;
        color: #ffffff;
        border-radius: 8px;
        border: none;
        font-size: 1.3rem;
        cursor: pointer;
        margin-top: 1.5rem;
        transition: background-color 0.3s ease, transform 0.3s ease;
      }
      
      button.btn:hover {
        background-color: #ff4f40;
        transform: translateY(-3px);
      }
      
      .h2 {
        text-align: center;
      }
        </style>
</head>

<header>
    <nav>
      <div class="logo">Brain Tumor Detection</div>
      <ul>
        <li><a href="{{ url_for('brain') }}">Home</a></li>
        <li><a href="{{ url_for('upload') }}">Upload Images</a></li>
        <li><a href="{{ url_for('patients') }}">Patients</a></li>
        <li><a href="{{ url_for('about') }}">About</a></li>
        <li><a href="{{ url_for('c') }}">Contact us</a></li>
      </ul>
    </nav>
  </header>
<body>
    <center><h2>Upload Images</h2></center>
    <form>
      <input type="file" id="file-input" webkitdirectory directory multiple style="display: none;">
      <label for="file-input" class="file-label">
        <span>Choose files</span>
      </label>
      <button type="submit" class="btn" id="submit-btn">Analyze</button>
    </form>
  </section>
  <script>
    document.getElementById('submit-btn').addEventListener('click', function() {
            var input = document.getElementById('file-input');
            if (input.files.length > 0) {
                var formData = new FormData();
                for (var i = 0; i < input.files.length; i++) {
                    formData.append('files[]', input.files[i]);
                }
                fetch('/process_folder', {
                    method: 'POST',
                    body: formData
                }).then(response => response.json())
                .then(data => {
                    console.log(data);
                }).catch(error => {
                    console.error(error);
                });
            } else {
                alert('Please select a folder to analyze.');
            }
        });
  </script>
</body>
</html>
